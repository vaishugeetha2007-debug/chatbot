<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.chat-container{
    width:400px;
    background:white;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    overflow:hidden;
}

.header{
    background:#0078ff;
    color:white;
    text-align:center;
    padding:15px;
    font-size:20px;
}

.chat-box{
    height:400px;
    overflow-y:auto;
    padding:10px;
}

.message{
    padding:10px;
    margin:5px;
    border-radius:10px;
    max-width:80%;
}

.user{
    background:#0078ff;
    color:white;
    margin-left:auto;
}

.bot{
    background:#e5e5e5;
}

.input-area{
    display:flex;
    border-top:1px solid #ccc;
}

input{
    flex:1;
    padding:10px;
    border:none;
    outline:none;
}

button{
    padding:10px 15px;
    border:none;
    background:#0078ff;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="chat-container">
    <div class="header">AI Chatbot</div>

    <div id="chatBox" class="chat-box"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
function addMessage(text, sender){
    let chatBox = document.getElementById("chatBox");

    let msg = document.createElement("div");
    msg.classList.add("message", sender);
    msg.innerText = text;

    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function botReply(userText){

    userText = userText.toLowerCase();

    if(userText.includes("hello")){
        return "Hello! How can I help you?";
    }
    else if(userText.includes("name")){
        return "I am a simple AI chatbot.";
    }
    else if(userText.includes("time")){
        return "Current time is: " + new Date().toLocaleTimeString();
    }
    else if(userText.includes("bye")){
        return "Goodbye! Have a nice day.";
    }
    else{
        return "I understand your message: " + userText;
    }
}

function sendMessage(){

    let input = document.getElementById("userInput");
    let text = input.value.trim();

    if(text === "") return;

    addMessage(text, "user");

    setTimeout(() => {
        addMessage(botReply(text), "bot");
    }, 500);

    input.value = "";
}
</script>

</body>
</html>
